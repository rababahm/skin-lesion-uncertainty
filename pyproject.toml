[project]
name = "project-name"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad Rababah", email = "119531086+rababahm@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
project-name = "project_name:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # style, real errors, import order, likely bugs, modern syntax

[tool.pytest.ini_options]
testpaths = ["tests"]